<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="blotches" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.006" numOctaves="3" seed="21" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.42
                0 0 0 0 0.28
                0 0 0 0 0.13
                0 0 0 0.5 0"/>
    </filter>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.35 0.35" numOctaves="2" seed="9" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.35
                0 0 0 0 0.22
                0 0 0 0 0.08
                0 0 0 0.35 0"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#ede0c8"/>
  <rect width="400" height="400" filter="url(#blotches)" opacity="0.7"/>
  <rect width="400" height="400" filter="url(#grain)" opacity="0.5"/>
</svg>